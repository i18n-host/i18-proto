syntax = "proto3";

message LangTxt
{
  uint32 lang = 1;
  string txt = 2;
}

enum Filetype {
  Md = 0;
  Yml = 1;
}

message UpdateLi
{
  Filetype filetype = 1;
  /* 源文本的语言 */
  uint32 src_lang = 2;
  bytes hash = 3;
  repeated LangTxt li = 4;
}

message TranTxt
{
  uint32 from_lang = 1;
  repeated uint32 to_lang = 2;
  string txt = 3;
  string path = 4;
}



message TranTask
{
  repeated UpdateLi update_li = 1 [ (rust.nullable_field) = false ];
}
